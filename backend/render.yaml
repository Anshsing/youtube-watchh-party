# Render deployment config for WatchParty
#
# The backend serves the frontend too, so this is a single full-stack deployment.
# Render auto-assigns PORT — don't set it here.

services:
  - type: web
    name: watchparty
    runtime: node
    rootDir: backend
    buildCommand: npm install --production
    startCommand: npm start
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info
